name: BIST Daily Scan

on:
  schedule:
    # 15:30 UTC = 18:30 Türkiye saati (TR yıl boyunca UTC+3, DST yok)
    # Pazartesi-Cuma (1-5) çalışır, hafta sonu (0,6) çalışmaz
    - cron: "30 15 * * 1-5"
  workflow_dispatch: {}   # Manuel olarak "Run workflow" ile de tetiklenebilir

permissions:
  contents: write   # state.json'u geri commit'leyebilmek için

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330   # 5.5 saat — kodun kendi 5 saatlik bütçesinden biraz fazla, güvenlik payı
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Taramayı çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Haftalık özeti çalıştır (sadece Cuma günleri devreye girer)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python weekly_summary.py

      - name: state.json, history.json ve bilanço önbelleğini commit'le
        run: |
          git config user.name "bist-alpha-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json history.json financials_cache.json report_excerpts_cache.json dead_tickers_cache.json foreign_ratio_history.json
          git diff --staged --quiet || git commit -m "Günlük tarama güncellemesi $(date -u +'%Y-%m-%d')"
          git push
