name: BIST Daily Scan

on:
  schedule:
    - cron: "30 15 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Repo'yu çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları yükle
        run: pip install -r requirements.txt

      - name: Görsel rapor tarayıcısını kur
        run: python -m playwright install --with-deps chromium

      - name: Taramayı çalıştır
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py

      - name: Haftalık özeti çalıştır (sadece Cuma günleri devreye girer)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python weekly_summary.py

      - name: State, case geçmişi ve önbellekleri commit'le
        run: |
          git config user.name "bist-alpha-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state.json history.json financials_cache.json report_excerpts_cache.json dead_tickers_cache.json foreign_ratio_history.json active_cases.json case_history.json case_daily_history.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "Günlük tarama güncellemesi $(date -u +'%Y-%m-%d')"
          git push
